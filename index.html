<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Calculator for FadikZ" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Calculator • FadikZ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="neural-bg"></canvas>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="brand">FADIKZ</span>
          <span class="sub">CALCULATOR</span>
        </div>
      </div>
    </header>

    <main class="calculator-wrapper">
      <div class="calculator glass">
        <div class="display">
          <div class="display-secondary" id="history">Ready</div>
          <div class="display-primary" id="display">0</div>
          <div class="neural-line"></div>
        </div>

        <div class="buttons">
          <button class="btn func" data-action="clear">C</button>
          <button class="btn func" data-action="sign">±</button>
          <button class="btn func" data-action="percent">%</button>
          <button class="btn op" data-action="operator" data-value="/">÷</button>

          <button class="btn num" data-value="7">7</button>
          <button class="btn num" data-value="8">8</button>
          <button class="btn num" data-value="9">9</button>
          <button class="btn op" data-action="operator" data-value="*">×</button>

          <button class="btn num" data-value="4">4</button>
          <button class="btn num" data-value="5">5</button>
          <button class="btn num" data-value="6">6</button>
          <button class="btn op" data-action="operator" data-value="-">−</button>

          <button class="btn num" data-value="1">1</button>
          <button class="btn num" data-value="2">2</button>
          <button class="btn num" data-value="3">3</button>
          <button class="btn op" data-action="operator" data-value="+">+</button>

          <button class="btn num zero" data-value="0">0</button>
          <button class="btn num" data-value=".">.</button>
          <button class="btn equal" data-action="equals">=</button>
        </div>
      </div>

      <div class="side-panel glass">
        <h3 class="panel-title">
          <span class="pulse"></span>
          Update
        </h3>

        <div class="loader-status">
          <div class="loader-visual" id="loader-visual">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="core"></div>
          </div>
          <p class="loader-text" id="loader-text">Waiting…</p>
        </div>

        <button class="btn-sync" id="btn-sync">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          Check for Updates
        </button>
      </div>
    </main>

    <footer class="footer">
      <span>Calculator for FadikZ</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
